name: Keep Render Alive

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping trpc endpoint (keep DB warm)
        run: curl -sf -o /dev/null https://aperosplit.onrender.com/api/trpc/equilibra.getGroupData?input=%7B%7D || true
